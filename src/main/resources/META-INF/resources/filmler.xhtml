<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Film Yönetimi</title>
</h:head>

<h:body>

    <div class="card" style="padding: 20px;">
        <h2>Film Yönetimi</h2>

        <!-- ANA FORM -->
        <h:form id="mainForm">

            <p:messages id="mainMessages"
                        showDetail="true"
                        closable="true"/>

            <p:commandButton value="Yeni Film"
                             icon="pi pi-plus"
                             action="#{filmBean.prepareNew}"
                             update=":dialogForm"
                             oncomplete="PF('filmDialogWidget').show()"
                             styleClass="ui-button-success"
                             style="margin-bottom: 15px"/>

            <div style="margin-bottom: 15px; display: flex; gap: 10px; align-items: center;">

                <p:inputText id="searchInput"
                             value="#{filmBean.searchKeyword}"
                             placeholder="Film adı ara..."
                             style="width: 300px"/>

                <p:commandButton value="Ara"
                                 icon="pi pi-search"
                                 action="#{filmBean.search}"
                                 update="filmTable"
                                 styleClass="ui-button-primary"/>

                <p:commandButton value="Temizle"
                                 icon="pi pi-times"
                                 action="#{filmBean.clearSearch}"
                                 update="searchInput filmTable"
                                 styleClass="ui-button-secondary"/>

            </div>

            <p:dataTable id="filmTable"
                         value="#{filmBean.lazyFilmModel}"
                         var="film"
                         lazy="true"
                         paginator="true"
                         rows="10"
                         responsiveLayout="scroll"
                         emptyMessage="Film bulunamadı">

                <p:column headerText="ID"
                          style="width: 60px; text-align: center;">
                    <h:outputText value="#{film.filmId}"/>
                </p:column>

                <p:column headerText="Film Adı"
                          sortBy="#{film.title}">
                    <h:outputText value="#{film.title}"/>
                </p:column>

                <p:column headerText="Açıklama">
                    <h:outputText value="#{film.description}"/>
                </p:column>

                <p:column headerText="Dil">
                    <h:outputText value="#{film.languageName}"/>
                </p:column>


                <p:column headerText="Yayın Yılı"
                          sortBy="#{film.releaseYear}">
                    <h:outputText value="#{film.releaseYear}"/>
                </p:column>

                <p:column headerText="Kira Ücreti"
                          sortBy="#{film.rentalRate}">
                    <h:outputText value="#{film.rentalRate}"/>
                </p:column>

                <p:column headerText="Süre"
                          sortBy="#{film.length}">
                    <h:outputText value="#{film.length}"/>
                </p:column>

                <p:column headerText="İşlemler"
                          style="width: 180px; text-align: center;">

                    <!-- DÜZENLE -->
                    <p:commandButton icon="pi pi-pencil"
                                     value="Düzenle"
                                     action="#{filmBean.prepareEdit(film)}"
                                     process="@this"
                                     update=":dialogForm"
                                     oncomplete="PF('filmDialogWidget').show()"
                                     styleClass="ui-button-warning"
                                     style="margin-right: 5px"/>

                    <!-- SİL -->
                    <p:commandButton icon="pi pi-trash"
                                     value="Sil"
                                     action="#{filmBean.delete}"
                                     update="filmTable mainMessages"
                                     styleClass="ui-button-danger">

                        <f:setPropertyActionListener
                                value="#{film}"
                                target="#{filmBean.selectedFilmDTO}"/>

                    </p:commandButton>

                </p:column>

            </p:dataTable>

        </h:form>


        <!-- DIALOG -->
        <p:dialog id="filmDialog"
                  widgetVar="filmDialogWidget"
                  header="Film Bilgileri"
                  modal="true"
                  responsive="true"
                  width="550">

            <!-- DIALOG FORM -->
            <h:form id="dialogForm">

                <h:inputHidden value="#{filmBean.selectedFilmDTO.filmId}"/>

                <p:messages id="dialogMessages"
                            showDetail="true"
                            closable="true"/>

                <p:panelGrid columns="2"
                             layout="grid"
                             columnClasses="ui-g-12 ui-md-4, ui-g-12 ui-md-8"
                             styleClass="ui-fluid ui-panelgrid-blank">

                    <p:outputLabel for="title"
                                   value="Film Adı:"/>

                    <p:inputText id="title"
                                 value="#{filmBean.selectedFilmDTO.title}"
                                 required="true"
                                 requiredMessage="Film adı zorunludur"/>


                    <p:outputLabel for="description"
                                   value="Açıklama:"/>

                    <p:inputTextarea id="description"
                                     value="#{filmBean.selectedFilmDTO.description}"
                                     rows="3"/>


                    <p:outputLabel for="releaseYear"
                                   value="Yayın Yılı:"/>

                    <p:inputText id="releaseYear"
                                 value="#{filmBean.selectedFilmDTO.releaseYear}"/>


                    <p:outputLabel for="language" value="Dil:"/>

                    <p:selectOneMenu id="language"
                                     value="#{filmBean.selectedFilmDTO.languageId}"
                                     style="width: 100%;">

                        <f:selectItem itemLabel="Dil seçiniz"
                                      itemValue="#{null}"
                                      noSelectionOption="true"/>

                        <f:selectItems
                                value="#{filmBean.languageList}"
                                var="language"
                                itemLabel="#{language.name}"
                                itemValue="#{language.languageId}"/>

                    </p:selectOneMenu>


                    <p:outputLabel for="rentalRate"
                                   value="Kira Ücreti:"/>

                    <p:inputText id="rentalRate"
                                 value="#{filmBean.selectedFilmDTO.rentalRate}"/>


                    <p:outputLabel for="length"
                                   value="Süre (dk):"/>

                    <p:inputText id="length"
                                 value="#{filmBean.selectedFilmDTO.length}"/>

                    <p:outputLabel for="actors"
                                   value="Oyuncular:"/>

                    <p:selectCheckboxMenu id="actors"
                                          value="#{filmBean.selectedFilmDTO.actorIds}"
                                          multiple="true"
                                          filter="true"
                                          filterMatchMode="contains"
                                          style="width: 100%;">

                        <f:selectItems
                                value="#{filmBean.actorList}"
                                var="actor"
                                itemLabel="#{actor.firstName} #{actor.lastName}"
                                itemValue="#{actor.actorId}"/>

                    </p:selectCheckboxMenu>


                    <p:outputLabel for="categories"
                                   value="Kategoriler:"/>

                    <p:selectCheckboxMenu id="categories"
                                          value="#{filmBean.selectedFilmDTO.categoryIds}"
                                          multiple="true"
                                          filter="true"
                                          filterMatchMode="contains"
                                          style="width: 100%;">

                        <f:selectItems
                                value="#{filmBean.categoryList}"
                                var="category"
                                itemLabel="#{category.name}"
                                itemValue="#{category.categoryId}"/>

                    </p:selectCheckboxMenu>

                </p:panelGrid>


                <!-- BUTONLAR DA FORMUN İÇİNDE -->
                <div style="text-align: right; margin-top: 15px;">

                    <!-- KAYDET -->
                    <p:commandButton value="Kaydet"
                                     icon="pi pi-check"
                                     process="@form"
                                     action="#{filmBean.saveDTO}"
                                     update=":mainForm:filmTable :dialogMessages"
                                     oncomplete="if (!args.validationFailed) PF('filmDialogWidget').hide()"
                                     styleClass="ui-button-success"
                                     style="margin-right: 5px"/>

                    <!-- İPTAL -->
                    <p:commandButton value="İptal"
                                     icon="pi pi-times"
                                     type="button"
                                     onclick="PF('filmDialogWidget').hide()"
                                     styleClass="ui-button-secondary"/>

                </div>

            </h:form>

        </p:dialog>

    </div>

</h:body>
</html>
