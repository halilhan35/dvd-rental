<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html">
<h:head>
    <title>Staff Ana Sayfa</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #f8fafc;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            padding: 14px 28px;
            border-bottom: 1px solid #e2e8f0;
        }

        .user-info {
            font-size: 14px;
            color: #334155;
            display: flex;
            align-items: center;
        }

        .badge-staff {
            background-color: #dbeafe;
            color: #1e40af;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 8px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-btn {
            text-decoration: none;
            color: #334155;
            background-color: #f1f5f9;
            border: 1px solid #cbd5e1;
            padding: 7px 14px;
            font-size: 13px;
            font-weight: 500;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .nav-btn:hover {
            background-color: #e2e8f0;
            color: #0f172a;
        }

        .btn-logout {
            background-color: #ef4444;
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-logout:hover {
            background-color: #dc2626;
        }

        .content-container {
            max-width: 900px;
            margin: 30px auto;
            padding: 24px;
            background: #ffffff;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        .content-container h1 {
            color: #0f172a;
            font-size: 22px;
            margin-bottom: 8px;
        }

        .content-container p {
            color: #64748b;
            font-size: 14px;
        }
    </style>
</h:head>

<h:body>

    <!-- ÜST BİLGİ & MENÜ ÇUBUĞU -->
    <div class="header-bar">

        <!-- Sol taraf: Kullanıcı Bilgisi -->
        <div class="user-info">
            <strong>Giriş Yapan:</strong>&#160;#{loggedInUserBean.username}
            <h:panelGroup rendered="#{loggedInUserBean.staff}">
                <span class="badge-staff">STAFF</span>
            </h:panelGroup>
        </div>

        <!-- Sağ taraf: Hızlı Menü & Çıkış Butonu -->
        <div class="header-actions">
            <a href="/filmler.xhtml" class="nav-btn">Film Yönetimi</a>
            <a href="/staff/rentals.xhtml" class="nav-btn">Aktif Kiralamalar</a>
            <a href="/change-password.xhtml" class="nav-btn">Şifre Değiştir</a>

            <form method="post" action="/logout" style="margin: 0;">
                <button type="submit" class="btn-logout">Çıkış Yap</button>
            </form>
        </div>

    </div>

    <!-- İÇERİK -->
    <div class="content-container">
        <h1>Staff Ana Sayfa Testi</h1>
        <p>Bu sayfa görünüyorsa, /staff/ klasör yapısı çalışıyor demektir.</p>
    </div>

</h:body>
</html>
