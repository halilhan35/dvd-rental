<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html">
<h:head>
    <title>Staff Ana Sayfa</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <h:outputStylesheet library="css" name="common.css"/>
    <h:outputStylesheet library="css" name="staff.css"/>
</h:head>

<h:body>

    <!-- ÜST BİLGİ & MENÜ ÇUBUĞU -->
    <div class="header-bar">

        <!-- Sol taraf: Kullanıcı Bilgisi -->
        <div class="user-info">
            <strong>Giriş Yapan:</strong>&#160;#{loggedInUserBean.username}
            <h:panelGroup rendered="#{loggedInUserBean.staff}">
                <span class="badge-staff">STAFF</span>
            </h:panelGroup>
        </div>

        <!-- Sağ taraf: Hızlı Menü & Çıkış Butonu -->
        <div class="header-actions">
            <a href="/filmler.xhtml" class="nav-btn">Film Yönetimi</a>
            <a href="/staff/rentals.xhtml" class="nav-btn">Aktif Kiralamalar</a>
            <a href="/change-password.xhtml" class="nav-btn">Şifre Değiştir</a>

            <form method="post" action="/logout" style="margin: 0;">
                <button type="submit" class="btn-logout">Çıkış Yap</button>
            </form>
        </div>

    </div>

    <!-- İÇERİK -->
    <div class="content-container">
        <h1>Staff Ana Sayfa Testi</h1>
        <p>Bu sayfa görünüyorsa, /staff/ klasör yapısı çalışıyor demektir.</p>
    </div>

</h:body>
</html>
