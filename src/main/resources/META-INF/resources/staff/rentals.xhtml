<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Aktif Kiralamalar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <h:outputStylesheet library="css" name="common.css"/>
    <h:outputStylesheet library="css" name="staff.css"/>
</h:head>

<h:body>

    <!-- ÜST BAR (KULLANICI BİLGİSİ & ÇIKIŞ) -->
    <div class="header-bar">
        <div class="user-info">
            <strong>Giriş Yapan:</strong>&#160;#{loggedInUserBean.username}
            <h:panelGroup rendered="#{loggedInUserBean.staff}">
                <span class="badge-staff">STAFF</span>
            </h:panelGroup>
        </div>

        <form method="post" action="/logout" style="margin: 0;">
            <button type="submit" class="btn-logout">Çıkış Yap</button>
        </form>
    </div>

    <!-- ANA İÇERİK KARTI -->
    <div class="content-card">

        <!-- BAŞLIK & GERİ DÖNÜŞ BUTONU -->
        <div class="card-header">
            <h2>Aktif Kiralamalar</h2>

            <p:button outcome="/staff/home.xhtml"
                      value="Ana Sayfaya Dön"
                      icon="pi pi-arrow-left"
                      styleClass="ui-button-outlined ui-button-secondary ui-button-sm"/>
        </div>

        <h:form id="mainForm">

            <p:messages id="mainMessages" showDetail="true" closable="true"/>

            <!-- İade Onay Dialog'u -->
            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true" width="360">
                <p:commandButton value="Vazgeç" type="button" styleClass="ui-confirmdialog-no ui-button-flat"/>
                <p:commandButton value="Evet, İade Al" type="button" styleClass="ui-confirmdialog-yes ui-button-success"/>
            </p:confirmDialog>

            <p:dataTable id="rentalsTable"
                         value="#{rentalBean.activeRentals}"
                         var="rental"
                         paginator="true"
                         rows="10"
                         responsiveLayout="scroll"
                         emptyMessage="Şu an aktif kiralama yok">

                <p:column headerText="Film" style="font-weight: 600;">
                    <h:outputText value="#{rental.filmTitle}"/>
                </p:column>

                <p:column headerText="Müşteri">
                    <h:outputText value="#{rental.customerName}"/>
                </p:column>

                <p:column headerText="Kiralama Tarihi" style="width: 170px; text-align: center;">
                    <h:outputText value="#{rental.rentalDateFormatted}"/>
                </p:column>

                <p:column headerText="İşlem" style="width: 140px; text-align: center;">
                    <p:commandButton icon="pi pi-replay"
                                     value="İade Al"
                                     action="#{rentalBean.returnFilm(rental.rentalId)}"
                                     update=":mainForm:mainMessages rentalsTable"
                                     styleClass="ui-button-success ui-button-sm"
                                     process="@this">
                        <p:confirm header="İade Onayı"
                                   message="&quot;#{rental.filmTitle}&quot; filmini iade almak istiyor musunuz?"
                                   icon="pi pi-exclamation-triangle"/>
                    </p:commandButton>
                </p:column>

            </p:dataTable>

        </h:form>

    </div>

</h:body>
</html>
