<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Film Kataloğu</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #f8fafc;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            padding: 14px 28px;
            border-bottom: 1px solid #e2e8f0;
            margin-bottom: 20px;
        }

        .user-info {
            font-size: 14px;
            color: #334155;
            display: flex;
            align-items: center;
        }

        .badge-customer {
            background-color: #e0e7ff;
            color: #3730a3;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 8px;
        }

        .btn-logout {
            background-color: #ef4444;
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-logout:hover {
            background-color: #dc2626;
        }

        .catalog-container {
            max-width: 1200px;
            margin: 0 auto 40px auto;
            padding: 24px;
            background: #ffffff;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .catalog-title {
            color: #0f172a;
            font-size: 22px;
            margin-bottom: 18px;
        }
    </style>
</h:head>

<h:body>

    <!-- 1. ÜST BAR & OTURUM ALANI -->
    <div class="header-bar">
        <div class="user-info">
            <strong>Hoş Geldiniz,</strong>&#160;#{loggedInUserBean.username}
            <span class="badge-customer">MÜŞTERİ</span>
        </div>

        <div style="display: flex; align-items: center; gap: 12px;">
            <a href="/customer/my-rentals.xhtml"
               style="text-decoration: none; padding: 8px 16px; border: 1px solid #cbd5e1;
                  border-radius: 6px; color: #334155; font-size: 13px; font-weight: 600;">
                <i class="pi pi-list" style="margin-right: 6px;"></i>Kiraladıklarım
            </a>
            <a href="/change-password.xhtml"
               style="text-decoration: none; padding: 8px 16px; border: 1px solid #cbd5e1;
          border-radius: 6px; color: #334155; font-size: 13px; font-weight: 600;">
                <i class="pi pi-key" style="margin-right: 6px;"></i>Şifre Değiştir
            </a>

            <form method="post" action="/logout" style="margin: 0;">
                <button type="submit" class="btn-logout">Çıkış Yap</button>
            </form>
        </div>
    </div>

    <!-- 2. ANA KATALOG KARTI -->
    <div class="catalog-container">
        <h2 class="catalog-title">Film Kataloğu</h2>

        <h:form id="mainForm">

            <!-- Enter tuşuna basıldığında Ara butonunu tetikler -->
            <p:defaultCommand target="btnSearch"/>

            <p:messages id="mainMessages" showDetail="true" closable="true"/>

            <!-- Kiralama Onay Kutusu -->
            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true" width="360">
                <p:commandButton value="Vazgeç" type="button" styleClass="ui-confirmdialog-no ui-button-flat"/>
                <p:commandButton value="Evet, Kirala" type="button" styleClass="ui-confirmdialog-yes ui-button-primary"/>
            </p:confirmDialog>

            <!-- ARAMA VE FİLTRE ÇUBUĞU -->
            <div style="margin-bottom: 18px; display: flex; gap: 10px; align-items: center;">
                <p:inputText id="searchInput"
                             value="#{filmBean.searchKeyword}"
                             placeholder="Film adı veya anahtar kelime..."
                             style="width: 320px"/>

                <p:commandButton id="btnSearch"
                                 value="Ara"
                                 icon="pi pi-search"
                                 action="#{filmBean.search}"
                                 update="filmTable"
                                 styleClass="ui-button-primary"/>

                <p:commandButton value="Temizle"
                                 icon="pi pi-times"
                                 action="#{filmBean.clearSearch}"
                                 update="searchInput filmTable"
                                 styleClass="ui-button-secondary"/>
            </div>

            <!-- FİLM LİSTESİ -->
            <p:dataTable id="filmTable"
                         value="#{filmBean.lazyFilmModel}"
                         var="film"
                         lazy="true"
                         paginator="true"
                         rows="10"
                         responsiveLayout="scroll"
                         emptyMessage="Kriterlere uygun film bulunamadı">

                <p:column headerText="Film Adı" sortBy="#{film.title}" style="width: 220px; font-weight: 600;">
                    <h:outputText value="#{film.title}"/>
                </p:column>

                <p:column headerText="Açıklama">
                    <h:outputText value="#{film.description}"/>
                </p:column>

                <p:column headerText="Dil" style="width: 100px; text-align: center;">
                    <h:outputText value="#{film.languageName}"/>
                </p:column>

                <p:column headerText="Süre" sortBy="#{film.length}" style="width: 90px; text-align: center;">
                    <h:outputText value="#{film.length}">
                        <f:convertNumber pattern="0' dk'"/>
                    </h:outputText>
                </p:column>

                <p:column headerText="Ücret" sortBy="#{film.rentalRate}" style="width: 110px; text-align: center; font-weight: 600; color: #16a34a;">
                    <h:outputText value="#{film.rentalRate}">
                        <f:convertNumber type="currency" currencySymbol="$" locale="tr_TR"/>
                    </h:outputText>
                </p:column>

                <p:column headerText="İşlem" style="width: 130px; text-align: center;">
                    <p:commandButton icon="pi pi-shopping-cart"
                                     value="Kirala"
                                     title="Bu filmi kirala"
                                     action="#{rentalBean.rent(film.filmId)}"
                                     update=":mainForm:mainMessages filmTable"
                                     styleClass="ui-button-info">
                        <p:confirm header="Kiralama Onayı"
                                   message="'#{film.title}' filmini kiralamak istiyor musunuz?"
                                   icon="pi pi-info-circle"/>
                    </p:commandButton>
                </p:column>

            </p:dataTable>

        </h:form>
    </div>

</h:body>
</html>
