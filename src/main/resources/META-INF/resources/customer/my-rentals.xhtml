<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Kiraladıklarım</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <h:outputStylesheet library="css" name="common.css"/>
    <h:outputStylesheet library="css" name="customer.css"/>
</h:head>

<h:body>

    <!-- ÜST BAR & OTURUM ALANI -->
    <div class="header-bar">
        <div class="user-info">
            <strong>Hoş Geldiniz,</strong>&#160;#{loggedInUserBean.username}
            <span class="badge-customer">MÜŞTERİ</span>
        </div>


        <div style="display: flex; align-items: center; gap: 12px;">
            <a href="/customer/my-rentals.xhtml"
               style="text-decoration: none; padding: 8px 16px; border: 1px solid #cbd5e1;
                  border-radius: 6px; color: #334155; font-size: 13px; font-weight: 600;">
                <i class="pi pi-list" style="margin-right: 6px;"></i>Kiraladıklarım
            </a>

            <form method="post" action="/logout" style="margin: 0;">
                <button type="submit" class="btn-logout">Çıkış Yap</button>
            </form>
        </div>
    </div>

    <!-- ANA İÇERİK KARTI -->
    <div class="rental-container">

        <div class="rental-header">
            <h2 class="rental-title">Kiraladığım Filmler</h2>

            <!-- Kataloğa Geri Dönüş Linki -->
            <a href="/customer/films.xhtml"
               style="text-decoration: none; padding: 8px 16px; border: 1px solid #cbd5e1;
          border-radius: 6px; color: #334155; font-size: 13px; font-weight: 600;">
                <i class="pi pi-arrow-left" style="margin-right: 6px;"></i>Film Kataloğuna Git
            </a>
        </div>

        <h:form id="mainForm">

            <!-- Bildirim Mesajları -->
            <p:messages id="mainMessages" showDetail="true" closable="true"/>

            <!-- İade Onay Penceresi -->
            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true" width="360">
                <p:commandButton value="Vazgeç" type="button" styleClass="ui-confirmdialog-no ui-button-flat"/>
                <p:commandButton value="Evet, İade Et" type="button" styleClass="ui-confirmdialog-yes ui-button-success"/>
            </p:confirmDialog>

            <p:dataTable id="rentalsTable"
                         value="#{rentalBean.myRentals}"
                         var="rental"
                         paginator="true"
                         rows="10"
                         responsiveLayout="scroll"
                         emptyMessage="Henüz hiçbir film kiralamadınız.">

                <!-- FİLM ADI -->
                <p:column headerText="Film" style="font-weight: 600; min-width: 200px;">
                    <h:outputText value="#{rental.filmTitle}"/>
                </p:column>

                <!-- KİRALAMA TARİHİ -->
                <p:column headerText="Kiralama Tarihi" style="width: 170px; text-align: center;">
                    <h:outputText value="#{rental.rentalDateFormatted}"/>
                </p:column>

                <!-- DURUM (Rozet ile) -->
                <p:column headerText="Durum" style="width: 130px; text-align: center;">
                    <span class="status-badge #{rental.returnDate == null ? 'status-active' : 'status-returned'}">
                        #{rental.returnDate == null ? 'Kirada' : 'İade Edildi'}
                    </span>
                </p:column>

                <!-- İADE TARİHİ -->
                <p:column headerText="İade Tarihi" style="width: 170px; text-align: center;">
                    <h:outputText value="#{rental.returnDateFormatted}"/>
                </p:column>

                <!-- İŞLEMLER (İade Butonu) -->
                <p:column headerText="Durum Detayı" style="width: 130px; text-align: center;">
                    <h:outputText value="Kirada" rendered="#{rental.returnDate == null}" style="font-size: 13px; color: #92400e; font-weight: 600;"/>
                    <h:outputText value="Tamamlandı" rendered="#{rental.returnDate != null}" style="font-size: 13px; color: #64748b;"/>
                </p:column>

            </p:dataTable>

        </h:form>

    </div>

</h:body>
</html>
