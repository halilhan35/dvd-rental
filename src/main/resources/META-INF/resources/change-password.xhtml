<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Şifre Değiştir</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
</h:head>

<h:body>

    <div class="card" style="max-width: 480px; margin: 40px auto; padding: 24px;">

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <h2 style="margin: 0;">Şifre Değiştir</h2>

            <h:outputLink value="/staff/home.xhtml" rendered="#{loggedInUserBean.staff}"
                          style="text-decoration: none; padding: 8px 16px; border: 1px solid #cbd5e1; border-radius: 6px; color: #334155; font-size: 13px; font-weight: 600;">
                Geri Dön
            </h:outputLink>

            <h:outputLink value="/customer/films.xhtml" rendered="#{loggedInUserBean.customer}"
                          style="text-decoration: none; padding: 8px 16px; border: 1px solid #cbd5e1; border-radius: 6px; color: #334155; font-size: 13px; font-weight: 600;">
                Geri Dön
            </h:outputLink>
        </div>

        <h:form id="pwForm">

            <p:messages id="messages" showDetail="true" closable="true"/>

            <div class="ui-fluid">

                <div style="margin-bottom: 16px;">
                    <p:outputLabel for="current" value="Mevcut Şifre"/>
                    <p:password id="current"
                                value="#{passwordBean.currentPassword}"
                                required="true"
                                requiredMessage="Mevcut şifre zorunludur"
                                toggleMask="true"/>
                </div>

                <div style="margin-bottom: 16px;">
                    <p:outputLabel for="newPw" value="Yeni Şifre (en az 4 karakter)"/>
                    <p:password id="newPw"
                                value="#{passwordBean.newPassword}"
                                required="true"
                                requiredMessage="Yeni şifre zorunludur"
                                toggleMask="true"/>
                </div>

                <div style="margin-bottom: 20px;">
                    <p:outputLabel for="confirm" value="Yeni Şifre (Tekrar)"/>
                    <p:password id="confirm"
                                value="#{passwordBean.confirmPassword}"
                                required="true"
                                requiredMessage="Şifre tekrarı zorunludur"
                                toggleMask="true"/>
                </div>

            </div>

            <p:commandButton value="Şifreyi Değiştir"
                             icon="pi pi-key"
                             action="#{passwordBean.changePassword}"
                             process="@form"
                             update="@form"
                             styleClass="ui-button-success"/>

        </h:form>

    </div>

</h:body>
</html>
