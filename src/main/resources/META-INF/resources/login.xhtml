<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html">

<h:head>
    <title>Giriş Yap</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f4f6f9; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-card { background: #ffffff; width: 100%; max-width: 400px; padding: 36px 32px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #e9ecef; }
        .login-card h2 { font-size: 24px; color: #1a202c; margin-bottom: 24px; font-weight: 600; text-align: center; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 500; color: #4a5568; }
        .form-control { width: 100%; padding: 10px 12px; font-size: 14px; border: 1px solid #cbd5e0; border-radius: 6px; outline: none; }
        .form-control:focus { border-color: #3182ce; box-shadow: 0 0 0 3px rgba(49,130,206,0.15); }
        .btn-submit { width: 100%; padding: 11px; font-size: 15px; font-weight: 600; color: #fff; background-color: #2b6cb0; border: none; border-radius: 6px; cursor: pointer; margin-top: 8px; }
        .btn-submit:hover { background-color: #2c5282; }
    </style>
</h:head>

<h:body>
    <div class="login-card">
        <h2>Giriş Yap</h2>

        <h:panelGroup layout="block" rendered="#{param.error != null}">
            <div style="background:#fee2e2;color:#991b1b;border:1px solid #fca5a5;padding:10px 14px;border-radius:6px;margin-bottom:16px;font-size:14px;">
                Kullanıcı adı veya şifre hatalı.
            </div>
        </h:panelGroup>

        <h:panelGroup layout="block" rendered="#{param.logout != null}">
            <div style="background:#dcfce7;color:#166534;border:1px solid #86efac;padding:10px 14px;border-radius:6px;margin-bottom:16px;font-size:14px;">
                Başarıyla çıkış yapıldı.
            </div>
        </h:panelGroup>

        <form method="post" action="/login-process">
            <div class="form-group">
                <label for="username">Kullanıcı Adı / E-posta</label>
                <input type="text" id="username" name="username" class="form-control" autocomplete="username" required="required"/>
            </div>
            <div class="form-group">
                <label for="password">Şifre</label>
                <input type="password" id="password" name="password" class="form-control" autocomplete="current-password" required="required"/>
            </div>
            <button type="submit" class="btn-submit">Giriş Yap</button>
        </form>
    </div>
</h:body>
</html>
